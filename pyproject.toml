[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "routeshield"
version = "1.0.0"
description = "Uncertainty-aware fleet route risk intelligence for Indian roads"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.3"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.5"]
dev = ["pytest>=7.4"]

[project.scripts]
routeshield = "routeshield.cli:main"

[tool.setuptools.packages.find]
include = ["routeshield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning"]
